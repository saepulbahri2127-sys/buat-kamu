<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Kamu ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            text-align: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            position: relative;
        }

        h1 {
            color: #d63384;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 50px;
        }

        button {
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        #btn-mau {
            background-color: #ff4b2b;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 75, 43, 0.3);
        }

        #btn-mau:hover {
            transform: scale(1.1);
            background-color: #ff416c;
        }

        #btn-gak {
            background-color: #6c757d;
            color: white;
            position: absolute;
            right: 20px;
        }

        .hidden {
            display: none;
        }

        .heart {
            font-size: 4rem;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <div class="heart">💖</div>
        <h1 id="title">Halo Manis! ✨</h1>
        <p id="text">Tahu gak? Codingan rumit aja ada solusinya, tapi mikirin kamu ga ada obatnya. 😳<br><br><b>Mau gak jadi pacar aku?</b></p>
        
        <div class="btn-container" id="btn-group">
            <button id="btn-mau" onclick="terima()">MAU BANGGET! ❤️</button>
            <button id="btn-gak" onmouseover="kabur()" onclick="kabur()">Gak Mau 😜</button>
        </div>
    </div>

    <script>
        function kabur() {
            const btnGak = document.getElementById('btn-gak');
            
            // Hitung posisi acak di dalam layar
            const x = Math.random() * (window.innerWidth - btnGak.offsetWidth - 40);
            const y = Math.random() * (window.innerHeight - btnGak.offsetHeight - 40);
            
            // Ubah posisi tombol jadi absolute di layar
            btnGak.style.position = 'fixed';
            btnGak.style.left = `${x}px`;
            btnGak.style.top = `${y}px`;
        }

        function terima() {
            const card = document.getElementById('main-card');
            card.innerHTML = `
                <div class="heart">🎉💖🥳</div>
                <h1>YEAYYY! OFFICIAL NIH!</h1>
                <p>Makasih yaa udah mau ngerespon! Promise to make you happy every single day! 🥰✨</p>
            `;
        }
    </script>
</body>
</html>
